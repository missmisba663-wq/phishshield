<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}PhishShield{% endblock %} · PhishShield</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%235b8cff' d='M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5z'/></svg>">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">
      <svg viewBox="0 0 24 24"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>
        <path fill="url(#g)" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5z"/><path fill="none" stroke="#fff" stroke-width="2" d="m8.5 12 2.5 2.5 4.5-5"/></svg>
      PhishShield
    </a>
    <div class="nav-links">
      {% set p = request.path %}
      <a href="/scan" class="{{ 'active' if p.startswith('/scan') }}">Scanner</a>
      <a href="/training" class="{{ 'active' if p.startswith('/training') }}">Training</a>
      <a href="/learn" class="{{ 'active' if p.startswith('/learn') }}">Learn</a>
      <a href="/dashboard" class="{{ 'active' if p.startswith('/dashboard') }}">Dashboard</a>
      <a href="/about" class="{{ 'active' if p.startswith('/about') }}">About</a>
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer>PhishShield · AI-powered phishing detection &amp; awareness · Final Year Project · Content is analysed locally and never sent to third parties.</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
